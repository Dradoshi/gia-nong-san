<style>

.pl.dn{background:var(--dn);color:#fff}

.rg.on i{opacity:1}.rg.on span{font-weight:800}.rg b{text-align:right;font-variant-numeric:tabular-nums}
.mo{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}

.lg a{color:var(--g);font-weight:600}.lg{margin:8px 0 0;font-size:12px;color:var(--mut)}
.rl{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;margin:0 6px 6px 0}
.rl:hover{border-color:var(--g)}
.ft{margin:16px 16px 0;font-size:11.5px;color:var(--mut);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(pointer:coarse){.tb,.seg button,.ck{min-height:44px}.ck input{width:20px;height:20px}.rl{min-height:40px;padding:8px 14px}.hc{min-height:36px}.sl,.q{min-height:44px;font-size:16px}.q{-webkit-appearance:none;appearance:none}.rf{min-height:40px}}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}.tk{overflow-x:auto}.tkt{width:auto}}

.an .sp polyline{stroke-dasharray:1;animation:dr 1s ease-out both;animation-delay:var(--d,0ms)}
.dt>*{animation:cin .45s cubic-bezier(.2,.7,.2,1) both}.dt>:nth-child(n+2){animation-delay:.06s}.dt>:nth-child(n+4){animation-delay:.12s}.dt>:nth-child(n+6){animation-delay:.18s}

.cd.bu{animation:fu 2.6s ease-out}.cd.bd{animation:fw 2.6s ease-out}
.tk{overflow:hidden;margin:12px -16px -16px;padding:9px 0;border-top:1px solid #2b3a31;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}

@keyframes fu{0%,25%{background:#d3f3de}100%{background:#fff}}@keyframes fw{0%,25%{background:#fde0dd}100%{background:#fff}}

.bar .q{grid-column:1/-1;order:-1;min-width:0}.sl{flex:none;width:100%;min-width:0}.ck{justify-content:flex-end}
.tabs{padding:2px 8px 0}.tb{padding:10px 11px}
.gh,.sum,.nt,.rs,.ab,.sb,.cmp,.st,.inf,.ft,.em{margin-left:12px;margin-right:12px}
.gh{margin-top:16px}.dh{padding:6px 12px 0}.cv{margin:10px 12px 0}
.seg{width:100%}.seg button{flex:1;padding:8px 6px}#cp{width:100%}
.gd{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px 12px}
.cd{padding:10px 10px 9px;min-height:120px}
.cd .t{font-size:13px}
.cd .u{font-size:10.5px}
.cd .p{font-size:19px;margin-bottom:4px}
.cd .y{font-size:10.5px}
.st{grid-template-columns:1fr 1fr}
.big b{font-size:26px}
.card{padding:8px 10px}.card b{font-size:14px}

}
@media(max-width:420px){.rf-lbl{display:none}.rf{padding:7px 10px}}
@media(max-width:380px){

</style>

 return[...m].map(([k,v])=>[k,Math.round(v.reduce((s,x)=>s+x,0)/v.length)]).slice(-{week:26,month:24,year:5}[g])}
const CAP={day:"30 ngày gần nhất",week:"26 tuần gần nhất, giá trung bình tuần",month:"24 tháng gần nhất, giá trung bình tháng",year:"5 năm gần nhất, giá trung bình năm"};
const LP={},RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const tk=w=>{const a=w.filter(x=>x.has).slice(0,24).map(x=>{const c=chg(x);return`<button class="tki ${c.c}" data-id="${E(x.id)}">${E(x.name)} <b>${fm(x.price)}</b><i>${c.a} ${sgn(c.p)}%</i></button>`}).join("");return a?`<div class="tk" aria-label="Giá đang chạy"><div class="tkt">${a}${a}</div></div>`:""};
function fx(a){const L=$("#lst");L.classList.toggle("an",!!a);
 if(a&&!RM)L.querySelectorAll(".cd").forEach((e,i)=>e.style.setProperty("--d",Math.min(i,24)*22+"ms"));
 document.querySelectorAll(".cd[data-pr]").forEach(e=>{const k=e.dataset.id+"|"+S.sel,p=+e.dataset.pr;if(LP[k]!==undefined&&LP[k]!==p)e.classList.add(p>LP[k]?"bu":"bd");LP[k]=p})}
function cnt(){if(RM)return;document.querySelectorAll(".nu").forEach(e=>{const v=+e.dataset.v,t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/800);e.textContent=fm(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
const card=x=>{
 if(!x.has){
  return `<button class="cd nop" data-id="${E(x.id)}">
   <span class="t">${E(x.name)}</span>
   <span class="u">${E(x.unit)}</span>
   <span class="p">–</span>
   <span class="y">Chưa có giá</span>
  </button>`;
 }
 const c=chg(x),stale=!x.ref&&x.t<D0();
 const border=x.ref?"fl":c.c;
 let unitLine = E(x.unit);
 if (x.nat) unitLine += " · toàn quốc";
 let footer;
 if (x.ref) {footer = `<span class="pl fl">Tham khảo</span>`;}
 else {footer = `<span class="pl ${c.c}">${c.a} ${sgn(c.p)}%</span>${stale?`<span class="ds">Giá ${dl(x.t).toLowerCase()}</span>`:""}<span class="sp ${c.c}">${spark(x.trend)}</span>`;}
 return `<button class="cd ${border}" data-id="${E(x.id)}" data-pr="${x.price}">
   <span class="t">${E(x.name)}</span>
   <span class="u">${unitLine}</span>
   <span class="p">${fm(x.price)}</span>
   <span class="y">${footer}</span>
  </button>`;
};
function hl(it){
 const s=it.map(x=>({x,c:chg(x)})).sort((a,b)=>b.c.p-a.c.p),
  ch=(o,k)=>`<button class="hc ${k}" data-id="${E(o.x.id)}">${E(o.x.name)}<i>${o.c.a} ${sgn(o.c.p)}%</i></button>`,
  u=s.filter(o=>o.c.p>0).slice(0,3),d=s.filter(o=>o.c.p<0).slice(-3).reverse();
 return(u.length?`<div class="hl"><b>Tăng mạnh</b>${u.map(o=>ch(o,"up")).join("")}</div>`:"")+(d.length?`<div class="hl"><b>Giảm mạnh</b>${d.map(o=>ch(o,"dn")).join("")}</div>`:"")}
const opts=()=>`<option value="">Toàn quốc</option>`+Object.keys(PV).map(z=>`<optgroup label="${Z[z]}"><option value="z:${z}">Cả ${Z[z]}</option>${PV[z].map(p=>`<option value="p:${p}">${p}</option>`).join("")}</optgroup>`).join("");
function fillList(a){
 const it=items(),{p,z}=sel(),aw=it.filter(x=>x.has),w=aw.filter(x=>!x.ref),u=w.filter(x=>x.price>x.prev).length,d=w.filter(x=>x.price<x.prev).length;
 {const hh=hl(w)+tk(w);if(HK!==hh){HK=hh;$("#hh").innerHTML=hh}}
 $("#lst").innerHTML=(LD?"":'<div class="nt">Chưa kết nối được nguồn giá trực tuyến. Bạn vẫn có thể tra cứu thông tin từng loại cây bên dưới.</div>')+
 (!it.length?'<p class="em">Không tìm thấy loại cây phù hợp. Thử từ khoá khác, đổi tỉnh/thành, chọn "Tất cả" hoặc bỏ chọn "Chỉ cây có giá".</p>':
 `<div class="sum">${p||(z?Z[z]:"Toàn quốc")} · ${it.length} loại cây · ${aw.length} có giá${w.length?` · so với phiên trước: ${u} tăng, ${d} giảm, ${w.length-u-d} đi ngang`:""}${aw.length>w.length?` · ${aw.length-w.length} giá tham khảo`:""}</div>`+
 (S.cat==="all"?CATS.slice(1).map(([k,n])=>{const g=it.filter(x=>x.cat===k);return g.length?`<div class="gh">${n} <small>${g.length}</small></div><div class="gd">${g.map(card).join("")}</div>`:""}).join(""):`<div class="gd">${it.map(card).join("")}</div>`));fx(a)}
function viewList(a){
 $("#hh").innerHTML="";HK="";main.className="";
 main.innerHTML=`<div class="fb"><div class="bar"><select id="sl" class="sl" aria-label="Chọn tỉnh thành">${opts()}</select><input id="q" class="q" type="search" placeholder="Tìm cây trồng, ví dụ: sau rieng" aria-label="Tìm cây trồng" value="${E(S.q)}"><label class="ck"><input type="checkbox" id="hp"${S.hp?" checked":""}> Chỉ cây có giá</label></div>
 <div class="tabs" role="group" aria-label="Nhóm cây trồng">${CATS.map(([k,n])=>`<button class="tb" data-cat="${k}" aria-pressed="${S.cat===k}">${n}</button>`).join("")}</div></div><div id="lst"></div>`;
 $("#sl").value=S.sel;fillList(a)}
function rgs(x){
 const A=DATA[x.id]||{},{p}=sel(),L=Object.keys(A).filter(q=>q).map(q=>[q,A[q][A[q].length-1][1]]).sort((a,b)=>b[1]-a[1]);
 if(!L.length)return"";const mx=L[0][1];
 return`<section class="rs"><h3>Giá theo tỉnh thành</h3><div class="rgs">${L.map(([q,v])=>`<button class="rg${q===p?" on":""}" data-p="${E(q)}"><span>${E(q)}</span><i style="width:${Math.round(v/mx*100)}%"></i><b>${fm(v)}</b></button>`).join("")}</div></section>`}
function chart(x,h){
 if(CH){CH.destroy();CH=null}
 $(".cv").innerHTML=`<canvas id="cv" role="img" aria-label="Biểu đồ giá ${E(x.name)}"></canvas>`;
 $("#cp").textContent=CAP[S.g];
 const st=$("#st");
 if(typeof Chart==="undefined"){$(".cv").innerHTML='<p class="em">Chưa tải được biểu đồ.</p>';st.innerHTML="";return}
 const a=agg(h,S.g),v=a.map(z=>z[1]),mx=Math.max(...v),mn=Math.min(...v),av=v.reduce((s,n)=>s+n,0)/v.length,ch=(v[v.length-1]-v[0])/v[0]*100;
 st.innerHTML=[["Cao nhất",fm(mx)],["Thấp nhất",fm(mn)],["Trung bình",fm(av)],["Biến động cả kỳ",sgn(ch)+"%",ch>0?"up":ch<0?"dn":"fl"]].map(([l,n,c])=>`<div class="card"><span>${l}</span><b class="${c||""}">${n}</b></div>`).join("");
 const lb=a.map(z=>{const d=new Date(z[0]);return S.g==="year"?String(d.getFullYear()):S.g==="month"?`${d.getMonth()+1}/${d.getFullYear()}`:d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"})});
 const ctx=$("#cv").getContext("2d"),gr=ctx.createLinearGradient(0,0,0,280);
 gr.addColorStop(0,"rgba(31,143,70,.25)");gr.addColorStop(1,"rgba(31,143,70,0)");
 CH=new Chart(ctx,{type:"line",data:{labels:lb,datasets:[{data:v,borderColor:"#1f8f46",backgroundColor:gr,fill:true,tension:.3,borderWidth:2,pointRadius:a.length>40?0:3,pointHoverRadius:5}]},
  options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>fm(i.parsed.y)+" "+x.unit}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8}},y:{ticks:{callback:n=>fm(n)}}}}})}
function viewDetail(a){
 const x0=C.find(i=>i.id===S.id);if(!x0){S.id=null;return viewList()}
 const{p}=sel(),A=DATA[x0.id]||{};let r=p&&px(x0.id,p),nat=false;if(!r){r=px(x0.id,"");nat=!!(p&&r)}
 const h=r&&(p&&!nat?A[p]:A[""]),x={...x0,...(r||{})},c=r&&chg(x),cn=CATS.find(k=>k[0]===x.cat),s=mset(x.mo),cur=new Date().getMonth()+1,L=x.cat==="hc"?"Cao điểm tiêu thụ":"Mùa thu hoạch";
 $("#hh").innerHTML="";HK="";main.className="";
 main.innerHTML=`<button class="bk" data-act="back">← Quay lại danh sách</button>
 <div class="dh"><span class="tag">${cn?cn[1]:""}</span> <span class="tag">${E(p&&!nat?p:"Toàn quốc")}</span><h2>${E(x.name)}</h2>`+
 (r?`<div class="big"><b><span class="nu" data-v="${x.price}">${fm(x.price)}</span> <small>${E(x.unit)}</small></b>${x.ref?`<span class="cg fl">Giá tham khảo</span>`:`<span class="cg ${c.c}">${c.a} ${fm(Math.abs(c.d))} (${sgn(c.p)}%) so với ${pl(x).toLowerCase()}</span>`}</div>${x.ref?`<p class="stl">Loại này chưa có nguồn công bố giá hằng ngày nên đang hiển thị giá tham khảo theo mặt bằng chợ đầu mối.</p>`:x.t<D0()?`<p class="stl">Chưa có giá mới hôm nay. Đang hiển thị giá gần nhất, ngày ${dmy(x.t)}.</p>`:""}</div>${x.ref?"":`
 <div class="cmp"><div class="card"><span>${dl(x.t)}</span><b>${fm(x.price)}</b></div><div class="card"><span>${pl(x)}</span><b>${pv(x)}</b></div><div class="card"><span>Chênh lệch</span><b class="${c.c}">${c.d>0?"+":c.d<0?"−":""}${fm(Math.abs(c.d))}</b></div></div>
 <div class="sb"><div class="seg" role="group">${[["day","Ngày"],["week","Tuần"],["month","Tháng"],["year","Năm"]].map(([k,n])=>`<button data-g="${k}" aria-pressed="${S.g===k}">${n}</button>`).join("")}</div><span id="cp"></span></div>
 <div class="cv"></div><div class="st" id="st"></div>`}`:`<p class="em" style="margin:8px 0 0">Chưa có giá cập nhật cho loại cây này${p?" tại "+E(p):""}.</p></div>`)+
 rgs(x0)+
 `<section class="rs"><h3>Thông tin tra cứu</h3><div class="inf"><div class="card"><span>Nhóm</span><b>${cn?cn[1].replace(" & "," và "):""}</b></div><div class="card"><span>Đơn vị giá</span><b>${E(x.unit)}</b></div><div class="card"><span>Vùng trồng chính</span><b>${zt(x.z)}</b></div><div class="card"><span>${L}</span><b>${mtxt(x.mo)}</b></div></div></section>
 <section class="rs"><h3>Lịch ${L.toLowerCase()}</h3>${x.mo?`<div class="mo">${[...Array(12)].map((_,i)=>`<span class="${s.has(i+1)?"on":""}${i+1===cur?" now":""}">T${i+1}</span>`).join("")}</div><p class="lg">Ô xanh: ${L.toLowerCase()}. Viền đen: tháng hiện tại.</p>`:`<p class="lg">Chưa có lịch cho loại cây này.</p>`}</section>
 <section class="ab"><h3>Yếu tố ảnh hưởng đến giá</h3><p>${BLURB[x.cat]||""}</p></section>
 <section class="rs"><h3>Cây cùng nhóm</h3>${C.filter(y=>y.cat===x.cat&&y.id!==x.id).slice(0,10).map(y=>`<button class="rl" data-id="${E(y.id)}">${E(y.name)}</button>`).join("")}</section>`;
 if(r&&!x.ref)chart(x,h);if(a){main.className="dt";setTimeout(()=>main.className="",900);cnt()}}
function head(){
 const err=ERR,n=Object.keys(DATA).length;
 $("#up").innerHTML=`<span class="dot${err||OFF?" off":""}"></span><span class="txt">`+(LD
   ?`<b id="clk">${clock()}</b> · Giá mới nhất ngày ${dmy(LD)} · lấy lúc ${hm(FT)} · ${n} loại có giá${RS.size?`, trong đó ${RS.size} loại dùng giá tham khảo`:""}${NCH?` · ${NCH} giá vừa thay đổi`:""}`
   :(err?"Không tải được dữ liệu giá — đang dùng dữ liệu tĩnh":"Chưa có dữ liệu giá — đang dùng dữ liệu tĩnh"))+`</span>`;
}
function show(a){head();S.id?viewDetail(a):viewList(a)}
main.addEventListener("click",e=>{
 const t=e.target.closest("[data-act],[data-id],[data-cat],[data-g],[data-p]");if(!t)return;const d=t.dataset;
 if(d.id){S.id=d.id;S.g="day";show(1);scrollTo(0,0)}
 else if(d.act==="back"){S.id=null;show(1)}
 else if(d.p){S.sel="p:"+d.p;viewDetail()}
 else if(d.cat){S.cat=d.cat;main.querySelectorAll(".tb").forEach(b=>b.setAttribute("aria-pressed",b===t));fillList(1);t.scrollIntoView({inline:"center",block:"nearest",behavior:RM?"auto":"smooth"})}
 else if(d.g){S.g=d.g;viewDetail()}
});
$("#hh").addEventListener("click",e=>{const t=e.target.closest("[data-id]");if(t){S.id=t.dataset.id;S.g="day";show(1);scrollTo(0,0)}});
main.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;fillList()}});
main.addEventListener("change",e=>{if(e.target.id==="sl"){S.sel=e.target.value;fillList()}else if(e.target.id==="hp"){S.hp=e.target.checked;fillList(1)}});
$("#rf").addEventListener("click",()=>load(true));
let ly=0;addEventListener("scroll",()=>{const y=scrollY,f=$(".fb");if(f)f.classList.toggle("cp",y>ly&&y>160&&document.activeElement.id!=="q");ly=y},{passive:true});
load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(()=>load(),CONFIG.CHECK_MIN*60000);
setInterval(head,3e4);
/* đồng hồ chạy từng giây; sang ngày mới thì tự tải lại giá và tính lại so sánh hôm qua/hôm trước */
setInterval(()=>{const e=$("#clk");if(e)e.textContent=clock();const d=fd(new Date());if(d!==DAY){DAY=d;load(true)}},1000);
setInterval(checkUpdate,CONFIG.VERSION_CHECK_MIN*60000);
checkUpdate();
})();
</script>
</body>

name: Cap nhat gia nong san
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: gia, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    env: {TZ: Asia/Ho_Chi_Minh}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm i --no-audit --no-fund
      - run: node update.mjs
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "cap nhat gia" && git push)
